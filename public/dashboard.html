<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — MediShare</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell-root">
  <main class="app-main">
    <div class="app-topbar" id="app-topbar-root"></div>

    <div class="card" id="greeting-card" style="margin-bottom:24px;">
      <h2 id="greeting-text" style="font-size:21px;">Good day 👋</h2>
      <p style="margin-bottom:18px;">What would you like to do?</p>
      <div class="quick-actions" style="margin:0;">
        <a href="/find-medicine.html" class="btn btn-primary">🔍 Find Medicine</a>
        <a href="/share-medicine.html" class="btn btn-secondary">💊 Share Medicine</a>
      </div>
    </div>

    <h3 style="font-size:15px; color:var(--ink-soft); margin-bottom:14px;">Your Activity</h3>
    <div class="stat-grid">
      <div class="stat-card"><div class="num" id="stat-shared">0</div><div class="lbl">Medicine Shared</div></div>
      <div class="stat-card"><div class="num" id="stat-requests">0</div><div class="lbl">Requests Made</div></div>
      <div class="stat-card"><div class="num" id="stat-success">0</div><div class="lbl">Successful Shares</div></div>
      <div class="stat-card"><div class="num" id="stat-pending">0</div><div class="lbl">Pending</div></div>
    </div>

    <div class="section-title">Nearby Medicines <a href="/find-medicine.html" style="font-size:13px; font-weight:600;">See all →</a></div>
    <div id="nearby-grid" class="med-grid"></div>
  </main>
</div>

<script src="/js/common.js"></script>
<script>
let savedIds = [];

(async function () {
  if (!initShell('/dashboard.html', 'Dashboard')) return;
  const user = Auth.user();
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good Morning' : hour < 17 ? 'Good Afternoon' : 'Good Evening';
  document.getElementById('greeting-text').textContent = `${greeting}, ${user.name.split(' ')[0]} 👋`;

  try {
    const { user: fresh } = await api('/auth/me');
    Auth.updateUser(fresh);
    savedIds = fresh.savedMedicineIds || [];
    document.getElementById('stat-shared').textContent = fresh.medicinesShared || 0;
    document.getElementById('stat-success').textContent = fresh.successfulRequests || 0;
  } catch { /* ignore */ }

  try {
    const { requests } = await api('/requests/mine');
    document.getElementById('stat-requests').textContent = requests.length;
    document.getElementById('stat-pending').textContent = requests.filter(r => !['completed','declined','cancelled'].includes(r.status)).length;
  } catch { /* ignore */ }

  try {
    const coords = await getLocation();
    let q = '';
    if (coords) q = `?lat=${coords.lat}&lng=${coords.lng}`;
    const { medicines } = await api(`/medicines${q}`);
    const grid = document.getElementById('nearby-grid');
    if (!medicines.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">📭</div>No nearby medicines listed yet. Check back soon, or be the first to share one.</div>`;
      return;
    }
    grid.innerHTML = medicines.slice(0, 6).map(cardHtml).join('');
  } catch (e) { showToast(e.message, 'error'); }
})();

function cardHtml(m) {
  const dist = m.distanceKm != null ? `${m.distanceKm.toFixed(1)} km away` : m.location;
  return `
  <a class="med-card" href="/medicine-details.html?id=${m.id}" style="color:inherit;">
    <div class="med-thumb">${m.photo ? `<img src="${m.photo}" alt="${m.name}">` : '💊'}${saveHeartHtml(m.id, savedIds.includes(m.id))}</div>
    <div class="med-body">
      <div class="med-title-row"><span class="med-name">${m.name} ${m.strength}</span><span class="match-badge">${m.matchScore}% match</span></div>
      <div class="med-meta">
        ${m.verified ? '<span class="badge badge-verified">✓ Verified</span>' : ''}
        <span>📦 ${qtyLabel(m)}</span>
        <span>📍 ${dist}</span>
      </div>
    </div>
  </a>`;
}
</script>
</body>
</html>
