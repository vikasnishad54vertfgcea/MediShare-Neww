<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Details — MediShare</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell-root">
  <main class="app-main">
    <div class="app-topbar" id="app-topbar-root"></div>
    <div id="content"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3>Request this medicine</h3>
    <div class="form-error" id="req-err"></div>
    <form id="request-form">
      <div class="field"><label id="qty-label">Required quantity</label><input type="number" min="1" name="quantity" id="qty-input" value="1" required></div>
      <div class="field"><label>Reason (optional)</label><textarea name="reason" rows="3" placeholder="Briefly share why you need this"></textarea></div>
      <div class="field"><label>Prescription (optional, if applicable)</label><input type="file" name="prescription" accept="image/*,.pdf"></div>
      <div class="field">
        <label>Urgency</label>
        <div class="type-toggle">
          <label><input type="radio" name="urgency" value="normal" checked><span>🟢 Normal</span></label>
          <label><input type="radio" name="urgency" value="soon"><span>🟡 Needed Soon</span></label>
          <label><input type="radio" name="urgency" value="urgent"><span>🔴 Urgent</span></label>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" class="btn btn-ghost" id="modal-cancel" style="flex:1;">Cancel</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Send Request</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');

function typeBadge(m) {
  if (m.status === 'approved') return '<span class="badge badge-verified">✓ Verified</span>';
  if (m.status === 'pending') return '<span class="badge badge-pending">Pending review</span>';
  return '<span class="badge badge-rejected">Rejected</span>';
}

async function load() {
  const content = document.getElementById('content');
  try {
    const { medicine: m } = await api(`/medicines/${id}`);
    document.title = `${m.name} ${m.strength} — MediShare`;
    const user = Auth.user();
    let saved = false;
    try { const { user: fresh } = await api('/auth/me'); saved = (fresh.savedMedicineIds || []).includes(m.id); } catch { /* ignore */ }

    content.innerHTML = `
      <div class="card" style="max-width:680px;">
        <div style="display:flex; gap:20px; flex-wrap:wrap;">
          <div class="med-thumb" style="width:140px; height:140px; border-radius:16px; flex-shrink:0;">
            ${m.photo ? `<img src="${m.photo}" alt="${m.name}">` : '💊'}
          </div>
          <div style="flex:1; min-width:220px;">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <h2 style="font-size:22px; margin:0;">${m.name} ${m.strength}</h2>
              ${typeBadge(m)}
              <button class="heart-btn ${saved ? 'saved' : ''}" style="position:static;" id="detail-heart" data-save-id="${m.id}" onclick="handleHeartClick(this)">${saved ? '❤️' : '🤍'}</button>
            </div>
            <p style="margin:8px 0 14px;">${m.type} · ${m.manufacturer}</p>
            <div class="med-meta" style="font-size:13.5px; gap:14px;">
              <span>📦 ${qtyLabel(m)} available</span>
              <span>📍 ${m.location}</span>
            </div>
          </div>
        </div>

        <div class="section-title" style="margin-top:26px;">Details</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; font-size:13.5px;">
          <div><strong>Storage condition</strong><div style="color:var(--ink-soft);">${m.storageCondition || '—'}</div></div>
          <div><strong>Shared by</strong><div style="color:var(--ink-soft);">${m.donor?.name || 'A donor'} ${m.donor?.rating ? '· ⭐ ' + m.donor.rating : ''}</div></div>
        </div>

        <div id="action-area" style="margin-top:26px;"></div>
      </div>
    `;

    const actionArea = document.getElementById('action-area');
    if (m.donorId === user.id) {
      actionArea.innerHTML = `<p style="font-size:13px;">This is your own listing — manage it from <a href="/my-medicines.html">My Medicines</a>.</p>`;
    } else if (m.status !== 'approved' || m.quantity < 1) {
      actionArea.innerHTML = `<p style="font-size:13px;">This medicine isn't available for requests right now.</p>`;
    } else {
      actionArea.innerHTML = `<button class="btn btn-primary" id="open-request">Request Medicine</button>`;
      document.getElementById('open-request').addEventListener('click', () => {
        document.getElementById('qty-label').textContent = `Required quantity (${m.unit}${m.quantity > 1 ? 's' : ''}, max ${m.quantity})`;
        const qtyInput = document.getElementById('qty-input');
        qtyInput.max = m.quantity;
        qtyInput.value = 1;
        document.getElementById('modal-backdrop').classList.add('show');
      });
    }
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div>${e.message}</div>`;
  }
}

document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('modal-backdrop').classList.remove('show'));

document.getElementById('request-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('req-err');
  errBox.classList.remove('show');
  const fd = new FormData(e.target);
  fd.append('medicineId', id);
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await api('/requests', { method: 'POST', body: fd, isForm: true });
    document.getElementById('modal-backdrop').classList.remove('show');
    showToast('Request sent successfully ✓', 'success');
    setTimeout(() => location.href = '/requests.html', 1000);
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Send Request';
  }
});

if (initShell('/find-medicine.html', 'Medicine Details')) load();
</script>
</body>
</html>
