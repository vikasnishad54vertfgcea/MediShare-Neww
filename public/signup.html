<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — MediShare</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">💊</span>MediShare</div>
    <h1>Create your account</h1>
    <p class="auth-sub">Share eligible medicine, or find what you need nearby.</p>

    <div class="form-error" id="err"></div>

    <form id="signup-form">
      <div class="field">
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="e.g. Vikas Sharma">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Mobile Number</label>
          <input type="tel" name="mobile" required placeholder="98765 43210">
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label>Location</label>
        <input type="text" name="location" required placeholder="Area, City">
        <div class="field-hint" id="loc-hint">Detecting your location helps with nearby matching — you can also just type it.</div>
      </div>
      <div class="field">
        <label>I am a...</label>
        <div class="type-toggle">
          <label><input type="radio" name="userType" value="donor"><span>Donor</span></label>
          <label><input type="radio" name="userType" value="recipient"><span>Recipient</span></label>
          <label><input type="radio" name="userType" value="both" checked><span>Both</span></label>
        </div>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" required>
        I agree to the Terms &amp; Conditions and confirm I will only list eligible, unexpired medicine.
      </label>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <div class="auth-foot">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
if (Auth.token()) location.href = '/dashboard.html';

let coords = null;
getLocation().then((c) => {
  coords = c;
  document.getElementById('loc-hint').textContent = c
    ? 'Location detected — this helps show medicines that are actually near you.'
    : 'Location not detected. You can still type your area manually.';
});

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('err');
  errBox.classList.remove('show');
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  if (coords) { body.lat = coords.lat; body.lng = coords.lng; }
  try {
    const { token, user } = await api('/auth/signup', { method: 'POST', body });
    Auth.save(token, user);
    location.href = '/dashboard.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
  }
});
</script>
</body>
</html>
